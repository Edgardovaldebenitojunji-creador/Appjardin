<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jardín Infantil Las Terrazas - Asistencia</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Mammoth.js for docx parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      @media print {
        @page {
          size: legal landscape;
          margin: 8mm;
        }
        body {
          background-color: white !important;
        }
      }
    </style>
  </head>
  <body class="bg-white font-sans antialiased text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;
      
      const Icon = ({ name, size = 20, className = "" }) => {
        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        });
        return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
      };

      import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js").then(async ({ initializeApp }) => {
        const { getAuth, signInAnonymously, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
        const { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

        const firebaseConfig = {
          apiKey: "AIzaSyC5QsKG_1cwQjPLM6Ug9p5nFvS2cCYmEB4",
          authDomain: "asistencia-jardin.firebaseapp.com",
          projectId: "asistencia-jardin",
          storageBucket: "asistencia-jardin.firebasestorage.app",
          messagingSenderId: "103153253927",
          appId: "1:103153253927:web:ba51f2b54898ff83d9d802"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'jardin-asistencia-app';

        const timeToMins = (timeStr) => {
          if (!timeStr) return 0;
          const [h, m] = timeStr.split(':').map(Number);
          return (h * 60) + m;
        };

        const minsToTime = (mins) => {
          if (mins <= 0) return "00:00";
          const h = Math.floor(mins / 60);
          const m = mins % 60;
          return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        };

        const JORNADA_MINUTOS = 528;
        const HORA_INICIO_AM = "08:30";
        const HORA_INICIO_PM = "12:54";

        const getDaysOfMonth = (year, month) => {
          const date = new Date(year, month - 1, 1);
          const days = [];
          while (date.getMonth() === month - 1) {
            const dayOfWeek = date.getDay();
            if (dayOfWeek !== 0 && dayOfWeek !== 6) {
              days.push(new Date(date).toISOString().split('T')[0]);
            }
            date.setDate(date.getDate() + 1);
          }
          return days;
        };

        const FUNCIONARIAS_WORD_EXACTO = [
          "JACQUELINE ARELLANO MAMANI", "SARAY BLACETT GUZMAN", "PAULA BORQUEZ BENITT",
          "JACQUELINE BURGOS GONZALEZ", "NATALIA CARTAGENA OCHOA", "JOSELYN CORREA MAMANI",
          "LIZETTE CRUZ BUTRON", "DOLLY FERNANDEZ MAMANI", "NICOLE FERRADA MARTINEZ",
          "ERIKA FRANCINO FUENTES", "AMERICA GAETE FARFÁN", "PATRICIA GAVIÑO SANCHEZ",
          "SOLANGE GONZALEZ ARANCIBIA", "JOHANA MANRIQUEZ JAIME", "CINDY MARQUEZ MUÑOZ",
          "MIREYA MOLINA RAMIREZ", "PATRICIA PARODI FERNANDEZ", "BARBARA PEREZ MONARDES",
          "IRIS RAMOS LAZARO", "FRANCHESCA ROCHA JULIO", "VERONICA ROJAS ZAVALA",
          "YESENIA SALINAS BALTAZAR", "NICOLE SANTELICES CRUZ", "ALICIA SANTIS ZUÑIGA",
          "GEORGINA TAPIA MUÑOZ", "EDGARDO VALDEBENITO ROMERO", "JAEL VARGAS FLORES",
          "KATHERINE VEGA MATAMOROS", "YINA VERA DIAZ", "NATALY ZAGAL FLORES",
          "LAURA ZERNA MAMANI", "ANITA BARRAZA BARRERA"
        ];

        function App() {
          const [authUser, setAuthUser] = useState(null);
          const [loggedUser, setLoggedUser] = useState(null);
          const [users, setUsers] = useState([]);
          const [funcionarias, setFuncionarias] = useState([]);
          const [registros, setRegistros] = useState({});
          const [tareas, setTareas] = useState([]);
          const [currentView, setCurrentView] = useState('asistencia');
          const [sidebarOpen, setSidebarOpen] = useState(true);

          useEffect(() => {
            const initAuth = async () => {
              try {
                await signInAnonymously(auth);
              } catch (err) { console.error(err); }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (u) => setAuthUser(u));
            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!authUser) return;
            const refs = {
              app_users: collection(db, 'artifacts', appId, 'public', 'data', 'app_users'),
              funcionarias: collection(db, 'artifacts', appId, 'public', 'data', 'funcionarias'),
              registros: collection(db, 'artifacts', appId, 'public', 'data', 'registros'),
              tareas: collection(db, 'artifacts', appId, 'public', 'data', 'tareas')
            };

            const unsubUsuarios = onSnapshot(refs.app_users, (snap) => {
              const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
              if (data.length === 0) {
                const adminDefault = { nombre: 'Administrador', apellido: 'General', username: 'admin', password: '123', privilegio: 'completo', asignadoA: '' };
                setDoc(doc(refs.app_users, 'admin-default'), adminDefault);
                setUsers([{ id: 'admin-default', ...adminDefault }]);
              } else { setUsers(data); }
            });

            const unsubFuncionarias = onSnapshot(refs.funcionarias, (snap) => {
              const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
              if (data.length === 0) {
                FUNCIONARIAS_WORD_EXACTO.forEach((nombre, idx) => {
                  setDoc(doc(refs.funcionarias, `func-${idx + 1}`), { nombre, orden: idx + 1 });
                });
              } else {
                setFuncionarias(data.sort((a, b) => (a.orden || 0) - (b.orden || 0)));
              }
            });

            const unsubRegistros = onSnapshot(refs.registros, (snap) => {
              const recs = {};
              snap.docs.forEach(d => { recs[d.id] = d.data(); });
              setRegistros(recs);
            });

            const unsubTareas = onSnapshot(refs.tareas, (snap) => {
              setTareas(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            });

            return () => { unsubUsuarios(); unsubFuncionarias(); unsubRegistros(); unsubTareas(); };
          }, [authUser]);

          const handleLogin = (e) => {
            e.preventDefault();
            const { username, password } = e.target.elements;
            const user = users.find(u => u.username === username.value && u.password === password.value);
            if (user) setLoggedUser(user); else alert("Usuario o contraseña incorrectos.");
          };

          const isAdmin = loggedUser?.privilegio === 'completo' || loggedUser?.username === 'admin';
          
          const canSeeFunc = (funcNombre) => {
            if (isAdmin || loggedUser?.privilegio === 'lector_todos') return true;
            if (loggedUser?.privilegio === 'lector_uno') {
              return loggedUser.asignadoA && loggedUser.asignadoA.trim().toLowerCase() === funcNombre.trim().toLowerCase();
            }
            return true;
          };

          const funcionariasFiltradas = funcionarias.filter(f => canSeeFunc(f.nombre));
          const funcionariasParaReporte = funcionariasFiltradas;

          if (!loggedUser) {
            return (
              <div className="min-h-screen bg-blue-50/50 flex items-center justify-center p-4">
                <div className="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md border border-blue-100">
                  <div className="flex justify-center mb-6 text-blue-600 bg-blue-50 w-20 h-20 rounded-3xl items-center mx-auto border border-blue-200 shadow-inner">
                    <Icon name="shield-check" size={38} />
                  </div>
                  <h1 className="text-2xl font-extrabold text-center text-slate-900 mb-1">Acceso Institucional</h1>
                  <p className="text-center text-blue-600 mb-8 text-xs uppercase font-extrabold tracking-widest">Jardín Infantil Las Terrazas</p>
                  <form onSubmit={handleLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1.5">Usuario</label>
                      <input name="username" type="text" required className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-600 font-semibold text-slate-900 transition" placeholder="Ingrese usuario" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1.5">Contraseña</label>
                      <input name="password" type="password" required className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-600 font-semibold text-slate-900 transition" placeholder="••••••••" />
                    </div>
                    <button type="submit" className="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 transition shadow-lg shadow-blue-600/30 text-base mt-2">Ingresar al Sistema</button>
                  </form>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen flex bg-white text-slate-800 font-sans">
              <aside className={`print:hidden bg-white text-slate-700 transition-all duration-300 ${sidebarOpen ? 'w-72' : 'w-20'} flex flex-col fixed h-full z-20 shadow-xl border-r border-slate-200`}>
                <div className="p-5 flex items-center justify-between border-b border-slate-100 bg-blue-600 text-white">
                  {sidebarOpen && (
                    <div className="flex items-center space-x-3">
                      <div className="w-8 h-8 rounded-xl bg-white text-blue-600 flex items-center justify-center font-black shadow-md">LT</div>
                      <span className="font-extrabold text-xs tracking-wider uppercase">Las Terrazas</span>
                    </div>
                  )}
                  <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 hover:bg-blue-700 text-white rounded-xl transition"><Icon name="menu" size={20} /></button>
                </div>
                <div className="p-4 border-b border-slate-100 bg-blue-50/60">
                  {sidebarOpen ? (
                    <div>
                      <p className="text-[10px] text-blue-700 uppercase font-black tracking-wider">Sesión Activa</p>
                      <p className="font-extrabold text-slate-900 truncate text-sm mt-0.5">{loggedUser.nombre} {loggedUser.apellido}</p>
                      <span className="text-[9px] bg-blue-600 text-white px-2.5 py-0.5 rounded-lg uppercase font-black tracking-wider mt-1 inline-block">
                        {loggedUser.privilegio === 'completo' ? 'Administrador' : loggedUser.privilegio === 'lector_todos' ? 'Lector Todos' : `Lector (${loggedUser.asignadoA})`}
                      </span>
                    </div>
                  ) : (<Icon name="user" size={22} className="mx-auto text-blue-600" />)}
                </div>
                <nav className="flex-1 py-4 space-y-1.5 overflow-y-auto px-3">
                  <NavItem icon="calendar" label="Asistencia Diaria" view="asistencia" current={currentView} set={setCurrentView} open={sidebarOpen} />
                  <NavItem icon="file-spreadsheet" label="Reporte Mensual" view="resumen" current={currentView} set={setCurrentView} open={sidebarOpen} />
                  <NavItem icon="clock" label="Consulta de Atrasos" view="consulta_atrasos" current={currentView} set={setCurrentView} open={sidebarOpen} />
                  <NavItem icon="shield-alert" label="Permisos y L/M" view="permisos" current={currentView} set={setCurrentView} open={sidebarOpen} />
                  <NavItem icon="check-square" label="Mis Tareas" view="tareas" current={currentView} set={setCurrentView} open={sidebarOpen} />
                  <NavItem icon="users" label="Personal / Func." view="funcionarias" current={currentView} set={setCurrentView} open={sidebarOpen} />
                  <NavItem icon="key" label="Cambiar Contraseña" view="cambiar_clave" current={currentView} set={setCurrentView} open={sidebarOpen} />
                  {isAdmin && (<NavItem icon="settings" label="Perfiles y Accesos" view="usuarios" current={currentView} set={setCurrentView} open={sidebarOpen} />)}
                </nav>
                <div className="p-4 border-t border-slate-100 bg-slate-50">
                  <button onClick={() => setLoggedUser(null)} className="flex items-center space-x-3 text-rose-600 hover:bg-rose-50 w-full p-3 rounded-2xl transition text-sm font-bold"><Icon name="log-out" size={18} />{sidebarOpen && <span>Cerrar Sesión</span>}</button>
                </div>
              </aside>

              <main className={`flex-1 transition-all duration-300 ${sidebarOpen ? 'ml-72' : 'ml-20'} print:ml-0 print:w-full p-8 md:p-12 print:p-0 bg-slate-50/30`}>
                {currentView === 'asistencia' && <VistaAsistencia funcionarias={funcionariasFiltradas} registros={registros} db={db} appId={appId} isAdmin={isAdmin} />}
                {currentView === 'resumen' && <VistaResumen funcionarias={funcionariasParaReporte} registros={registros} db={db} appId={appId} isAdmin={isAdmin} />}
                {currentView === 'consulta_atrasos' && <VistaConsultaAtrasos funcionarias={funcionariasFiltradas} registros={registros} />}
                {currentView === 'permisos' && <VistaPermisosGlobal funcionarias={funcionariasFiltradas} registros={registros} db={db} appId={appId} isAdmin={isAdmin} funcionariasTodas={funcionarias} />}
                {currentView === 'tareas' && <VistaTareas tareas={tareas} db={db} appId={appId} />}
                {currentView === 'funcionarias' && <VistaFuncionarias funcionarias={funcionariasFiltradas} db={db} appId={appId} isAdmin={isAdmin} />}
                {currentView === 'cambiar_clave' && <VistaCambiarClave currentUser={loggedUser} db={db} appId={appId} onUpdate={(u) => setLoggedUser({...u})} />}
                {currentView === 'usuarios' && isAdmin && <VistaUsuarios users={users} db={db} appId={appId} currentUser={loggedUser} funcionariasDisponibles={funcionarias} />}
              </main>
            </div>
          );
        }

        function NavItem({ icon, label, view, current, set, open }) {
          const active = current === view;
          return (
            <button onClick={() => set(view)} className={`w-full flex items-center space-x-3.5 px-4 py-3 rounded-2xl transition text-sm font-semibold ${active ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30 font-bold' : 'text-slate-600 hover:bg-blue-50 hover:text-blue-600'} ${!open && 'justify-center'}`} title={!open ? label : ''}>
              <span className={active ? 'text-white' : 'text-slate-500'}><Icon name={icon} size={20} /></span>
              {open && <span className="truncate">{label}</span>}
            </button>
          );
        }

        function VistaCambiarClave({ currentUser, db, appId, onUpdate }) {
          const [actual, setActual] = useState('');
          const [nueva, setNueva] = useState('');
          const [confirmar, setConfirmar] = useState('');

          const handleSubmit = async (e) => {
            e.preventDefault();
            if (actual !== currentUser.password) {
              return alert("La contraseña actual es incorrecta.");
            }
            if (nueva !== confirmar) {
              return alert("Las nuevas contraseñas no coinciden.");
            }
            if (!nueva.trim()) {
              return alert("La nueva contraseña no puede estar vacía.");
            }
            
            const updatedUser = { ...currentUser, password: nueva };
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'app_users', currentUser.id), updatedUser, { merge: true });
            onUpdate(updatedUser);
            alert("¡Contraseña actualizada con éxito!");
            setActual(''); setNueva(''); setConfirmar('');
          };

          return (
            <div className="max-w-md mx-auto bg-white rounded-3xl shadow-sm p-8 border border-slate-200/80">
              <h2 className="text-2xl font-extrabold text-slate-900 mb-1">Cambiar Mi Contraseña</h2>
              <p className="text-sm text-slate-500 mb-6 font-medium">Actualiza tu clave de acceso de manera segura.</p>
              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1.5">Contraseña Actual</label>
                  <input type="password" value={actual} onChange={e => setActual(e.target.value)} className="w-full p-3.5 border border-slate-200 rounded-2xl outline-none bg-slate-50 font-bold text-sm" required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1.5">Nueva Contraseña</label>
                  <input type="password" value={nueva} onChange={e => setNueva(e.target.value)} className="w-full p-3.5 border border-slate-200 rounded-2xl outline-none bg-slate-50 font-bold text-sm" required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1.5">Confirmar Nueva Contraseña</label>
                  <input type="password" value={confirmar} onChange={e => setConfirmar(e.target.value)} className="w-full p-3.5 border border-slate-200 rounded-2xl outline-none bg-slate-50 font-bold text-sm" required />
                </div>
                <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-2xl hover:bg-blue-700 transition shadow-lg shadow-blue-600/20 text-sm mt-2">Actualizar Contraseña</button>
              </form>
            </div>
          );
        }

        function VistaAsistencia({ funcionarias, registros, db, appId, isAdmin }) {
          const [fecha, setFecha] = useState('2026-07-01');

          const updateRecord = async (funcId, updates) => {
            const recordId = `${fecha}_${funcId}`;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'registros', recordId);
            const current = registros[recordId] || { fecha, funcId, estado: null, atrasoMinutos: 0, horaLlegada: '', permisos: [], licencia: null };
            await setDoc(docRef, { ...current, ...updates });
          };

          const marcarTodos = (estado) => {
            if (!isAdmin) return alert("No tienes permisos para esta acción masiva.");
            if(!window.confirm(`¿Seguro que deseas marcar a todas las funcionarias visibles como ${estado}?`)) return;
            funcionarias.forEach(f => {
              const rec = registros[`${fecha}_${f.id}`];
              let minCubiertos = 0;
              if (rec?.licencia?.tipo === 'Completa') minCubiertos += JORNADA_MINUTOS;
              rec?.permisos?.forEach(p => { if (['Feriado Legal', 'Administrativo Día Completo'].includes(p.tipo)) minCubiertos += JORNADA_MINUTOS; });
              if (minCubiertos < JORNADA_MINUTOS) {
                updateRecord(f.id, { estado, atrasoMinutos: 0, horaLlegada: '' });
              }
            });
          };

          return (
            <div className="space-y-6 max-w-5xl mx-auto">
              <div className="flex flex-col md:flex-row justify-between items-center bg-white p-8 rounded-3xl shadow-sm border border-slate-200/80">
                <div>
                  <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900">Registro Diario de Asistencia</h2>
                  <p className="text-sm text-slate-500 mt-1 font-medium">Control diario de presencia, ausencias y atrasos.</p>
                </div>
                <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} className="mt-4 md:mt-0 border border-slate-200 p-3 rounded-2xl text-slate-800 outline-none font-bold bg-slate-50 shadow-inner" />
              </div>
              {isAdmin && (
                <div className="flex space-x-3 bg-white p-5 rounded-3xl shadow-sm border border-slate-200/80">
                  <button onClick={() => marcarTodos('Presente')} className="flex items-center px-5 py-3 bg-emerald-50 text-emerald-700 rounded-2xl hover:bg-emerald-100 font-bold text-sm transition border border-emerald-200 shadow-sm"><Icon name="check-check" size={18} className="mr-2"/> Marcar Todos Presentes</button>
                  <button onClick={() => marcarTodos('Ausente')} className="flex items-center px-5 py-3 bg-rose-50 text-rose-700 rounded-2xl hover:bg-rose-100 font-bold text-sm transition border border-rose-200 shadow-sm"><Icon name="x-circle" size={18} className="mr-2"/> Marcar Todos Ausentes</button>
                </div>
              )}
              <div className="space-y-4">
                {funcionarias.map(f => (
                  <TarjetaFuncionaria key={f.id} fecha={fecha} funcionaria={f} registros={registros} updateRecord={updateRecord} isAdmin={isAdmin} />
                ))}
                {funcionarias.length === 0 && (
                  <div className="p-8 text-center bg-white rounded-3xl border border-slate-200 text-slate-500 font-medium">
                    No hay funcionarias asignadas o visibles para tu cuenta.
                  </div>
                )}
              </div>
            </div>
          );
        }

        function TarjetaFuncionaria({ fecha, funcionaria, registros, updateRecord, isAdmin }) {
          const recordId = `${fecha}_${funcionaria.id}`;
          const record = registros[recordId] || { estado: null, atrasoMinutos: 0, horaLlegada: '', permisos: [], licencia: null };
          const handleUpdate = (updates) => {
            if (!isAdmin) return alert("Tu cuenta tiene permisos de lector y no puede modificar registros.");
            updateRecord(funcionaria.id, updates);
          };

          let minCubiertos = 0;
          let tieneFeriado = false;
          let esperaAm = false;

          if (record.licencia?.tipo === 'Completa') minCubiertos += JORNADA_MINUTOS;
          if (record.licencia?.tipo === 'Media') {
            minCubiertos += (JORNADA_MINUTOS / 2);
            if (record.licencia?.jornada === 'AM') esperaAm = true;
          }

          record.permisos.forEach(p => {
            if (p.tipo === 'Feriado Legal') { minCubiertos += JORNADA_MINUTOS; tieneFeriado = true; }
            if (p.tipo === 'Administrativo Día Completo') minCubiertos += JORNADA_MINUTOS;
            if (p.tipo === 'Administrativo Medio Día') {
              minCubiertos += (JORNADA_MINUTOS / 2);
              if (p.jornada === 'AM') esperaAm = true;
            }
            if (p.tipo === 'Descanso Complementario') { minCubiertos += (timeToMins(p.hasta) - timeToMins(p.desde)); }
            if (['Capacitación', 'Docencia', 'Horas Extras', 'Receso Invernal'].includes(p.tipo)) { minCubiertos += JORNADA_MINUTOS; }
          });

          const requiereAsistencia = minCubiertos < JORNADA_MINUTOS && !tieneFeriado;

          const handleAtrasoChange = (hora) => {
            if (!hora) { handleUpdate({ horaLlegada: '', atrasoMinutos: 0 }); return; }
            let baseMinutos = esperaAm ? timeToMins(HORA_INICIO_PM) : timeToMins(HORA_INICIO_AM);
            let llegadaMinutos = timeToMins(hora);
            let atraso = Math.max(0, llegadaMinutos - baseMinutos);
            handleUpdate({ horaLlegada: hora, atrasoMinutos: atraso });
          };

          return (
            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80 hover:shadow-md transition">

        function VistaPermisosGlobal({ funcionarias, registros, db, appId, isAdmin, funcionariasTodas }) {
          const [selectedFuncId, setSelectedFuncId] = useState(funcionarias[0]?.id || '');
          
          // Estados para formulario unitario
          const [fechaPermiso, setFechaPermiso] = useState('2026-07-01');
          const [tipoPermiso, setTipoPermiso] = useState('Feriado Legal');
          const [jornadaMedio, setJornadaMedio] = useState('AM');
          const [tipoLicencia, setTipoLicencia] = useState('Completa');
          const [minutosAtrasoExtra, setMinutosAtrasoExtra] = useState(15);

          // Estados para Carga Masiva por Rango de Fechas y Múltiples Funcionarias
          const [modoMasivo, setModoMasivo] = useState(false);
          const [seleccionTodas, setSeleccionTodas] = useState(true);
          const [funcionariasSeleccionadasIds, setFuncionariasSeleccionadasIds] = useState([]);
          const [fechaInicio, setFechaInicio] = useState('2026-07-13');
          const [fechaFin, setFechaFin] = useState('2026-07-24');
          const [tipoMasivo, setTipoMasivo] = useState('Receso Invernal');
          const [categoriaMasiva, setCategoriaMasiva] = useState('permiso'); // 'permiso' o 'licencia'

          // Sincronizar selección masiva inicial con todas las disponibles
          useEffect(() => {
            if (funcionariasTodas && funcionariasTodas.length > 0) {
              setFuncionariasSeleccionadasIds(funcionariasTodas.map(f => f.id));
            }
          }, [funcionariasTodas]);

          const recordId = `${fechaPermiso}_${selectedFuncId}`;
          const currentRecord = registros[recordId] || { fecha: fechaPermiso, funcId: selectedFuncId, estado: null, atrasoMinutos: 0, permisos: [], licencia: null };

          const handleAgregarPermiso = async (e) => {
            e.preventDefault();
            if (!isAdmin) return alert("Acción denegada para cuentas con perfil lector.");
            if (!selectedFuncId) return;
            const nuevoPermiso = { tipo: tipoPermiso, jornada: jornadaMedio };
            const nuevosPermisos = [...(currentRecord.permisos || []), nuevoPermiso];
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registros', recordId), { ...currentRecord, permisos: nuevosPermisos }, { merge: true });
            alert("Permiso agregado con éxito.");
          };

          const handleAgregarLicencia = async (e) => {
            e.preventDefault();
            if (!isAdmin) return alert("Acción denegada para cuentas con perfil lector.");
            if (!selectedFuncId) return;
            const nuevaLicencia = { tipo: tipoLicencia, jornada: jornadaMedio };
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registros', recordId), { ...currentRecord, licencia: nuevaLicencia }, { merge: true });
            alert("Licencia médica agregada con éxito.");
          };

          const handleRegistrarAtraso = async (e) => {
            e.preventDefault();
            if (!isAdmin) return alert("Acción denegada para cuentas con perfil lector.");
            if (!selectedFuncId) return;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registros', recordId), { ...currentRecord, estado: 'Atraso', atrasoMinutos: Number(minutosAtrasoExtra) }, { merge: true });
            alert("Atraso registrado con éxito.");
          };

          // Función para procesar la carga masiva en un rango de fechas para MÚLTIPLES funcionarias seleccionadas
          const handleCargaMasivaRango = async (e) => {
            e.preventDefault();
            if (!isAdmin) return alert("Acción denegada para cuentas con perfil lector.");
            if (funcionariasSeleccionadasIds.length === 0 || !fechaInicio || !fechaFin) {
              return alert("Selecciona al menos una funcionaria y el rango de fechas completo.");
            }

            const start = new Date(fechaInicio);
            const end = new Date(fechaFin);

            if (start > end) {
              return alert("La fecha de inicio no puede ser posterior a la fecha de fin.");
            }

            if (!window.confirm(`¿Aplicar "${tipoMasivo}" a ${funcionariasSeleccionadasIds.length} funcionarias seleccionadas desde el ${fechaInicio} hasta el ${fechaFin} (excluyendo fines de semana)?`)) {
              return;
            }

            let totalAplicados = 0;

            for (const fId of funcionariasSeleccionadasIds) {
              let currentD = new Date(start);
              while (currentD <= end) {
                const dayOfWeek = currentD.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                  const dateStr = currentD.toISOString().split('T')[0];
                  const recKey = `${dateStr}_${fId}`;
                  const existingRec = registros[recKey] || { fecha: dateStr, funcId: fId, estado: null, atrasoMinutos: 0, permisos: [], licencia: null };

                  if (categoriaMasiva === 'permiso') {
                    const yaTiene = existingRec.permisos?.some(p => p.tipo === tipoMasivo);
                    if (!yaTiene) {
                      const nuevosPermisos = [...(existingRec.permisos || []), { tipo: tipoMasivo }];
                      await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registros', recKey), { ...existingRec, permisos: nuevosPermisos }, { merge: true });
                      totalAplicados++;
                    }
                  } else if (categoriaMasiva === 'licencia') {
                    const nuevaLicencia = { tipo: tipoMasivo };
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registros', recKey), { ...existingRec, licencia: nuevaLicencia }, { merge: true });
                    totalAplicados++;
                  }
                }
                currentD.setDate(currentD.getDate() + 1);
              }
            }

            alert(`¡Carga masiva múltiple aplicada con éxito (${totalAplicados} registros generados)!`);
          };

          const toggleSeleccionarTodas = () => {
            if (seleccionTodas) {
              setFuncionariasSeleccionadasIds([]);
              setSeleccionadasTodas(false);
            } else {
              setFuncionariasSeleccionadasIds(funcionariasTodas.map(f => f.id));
              setSeleccionadasTodas(true);
            }
          };

          const funcionariaActualObj = funcionarias.find(f => f.id === selectedFuncId);

          const historicoFunc = Object.keys(registros)
            .filter(key => key.endsWith(`_${selectedFuncId}`))
            .map(key => ({ fecha: key.split('_')[0], ...registros[key] }))
            .filter(r => (r.permisos?.length > 0 || r.licencia || r.estado === 'Atraso' || r.estado === 'Ausente'))
            .sort((a, b) => b.fecha.localeCompare(a.fecha));

          return (
            <div className="space-y-6 max-w-5xl mx-auto">
              <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200/80">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                  <div>
                    <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-1">Gestión e Histórico: Permisos y L/M</h2>
                    <p className="text-sm text-slate-500 font-medium">Administra registros individuales o aplica permisos/licencias masivas a múltiples funcionarias por rango de fechas.</p>
                  </div>
                  {isAdmin && (
                    <div className="bg-slate-100 p-1.5 rounded-2xl flex space-x-1 border border-slate-200">
                      <button onClick={() => setModoMasivo(false)} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${!modoMasivo ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:text-slate-900'}`}>Registro Individual</button>
                      <button onClick={() => setModoMasivo(true)} className={`px-4 py-2 rounded-xl text-xs font-bold transition ${modoMasivo ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:text-slate-900'}`}>⚡ Carga Masiva (Múltiples)</button>
                    </div>
                  )}
                </div>

                {!modoMasivo && (
                  <div className="bg-slate-50 p-5 rounded-3xl border border-slate-200 mb-8">
                    <label className="block text-xs font-extrabold text-slate-700 uppercase mb-2">Seleccionar Funcionaria</label>
                    <select value={selectedFuncId} onChange={e => setSelectedFuncId(e.target.value)} className="w-full p-3.5 border border-slate-200 rounded-2xl bg-white font-extrabold text-slate-900 outline-none shadow-sm">
                      {funcionarias.map(f => (
                        <option key={f.id} value={f.id}>{f.nombre}</option>
                      ))}
                    </select>
                  </div>
                )}

                {isAdmin && modoMasivo && (
                  <div className="border border-blue-200 p-6 rounded-3xl mb-8 bg-blue-50/50">
                    <h3 className="font-extrabold text-base text-blue-950 mb-4 flex items-center">
                      <span className="bg-blue-600 text-white p-1 rounded-lg mr-2 text-xs">⚡</span> Carga Masiva para Múltiples Funcionarias (Ej: Receso Invernal 13 al 24 de Julio)
                    </h3>
                    <form onSubmit={handleCargaMasivaRango} className="space-y-5">
                      <div>
                        <div className="flex justify-between items-center mb-2">
                          <label className="text-xs font-bold text-slate-700 uppercase">Seleccionar Funcionarias (Puedes marcar a varias o todas)</label>
                          <button type="button" onClick={() => {
                            if (funcionariasSeleccionadasIds.length === funcionariasTodas.length) {
                              setFuncionariasSeleccionadasIds([]);
                            } else {
                              setFuncionariasSeleccionadasIds(funcionariasTodas.map(f => f.id));
                            }
                          }} className="text-xs font-bold text-blue-600 hover:underline">
                            {funcionariasSeleccionadasIds.length === funcionariasTodas.length ? 'Deseleccionar todas' : 'Seleccionar todas'}
                          </button>
                        </div>
                        <div className="max-h-48 overflow-y-auto bg-white border border-slate-200 rounded-2xl p-3 grid grid-cols-1 md:grid-cols-2 gap-2">
                          {funcionariasTodas.map(f => {
                            const seleccionado = funcionariasSeleccionadasIds.includes(f.id);
                            return (
                              <label key={f.id} className={`flex items-center space-x-2 p-2 rounded-xl text-xs font-bold cursor-pointer transition ${seleccionado ? 'bg-blue-50 text-blue-900 border border-blue-200' : 'hover:bg-slate-50 text-slate-700'}`}>
                                <input type="checkbox" checked={seleccionado} onChange={(e) => {
                                  if (e.target.checked) {
                                    setFuncionariasSeleccionadasIds([...funcionariasSeleccionadasIds, f.id]);
                                  } else {
                                    setFuncionariasSeleccionadasIds(funcionariasSeleccionadasIds.filter(id => id !== f.id));
                                  }
                                }} className="w-4 h-4 text-blue-600 rounded accent-blue-600" />
                                <span className="truncate">{f.nombre}</span>

                        </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">

                        <div>

                            else setCategoriaMasiva('permiso');

                            <option value="Receso Invernal">Receso Invernal (R/I)</option>
