                            <option value="Administrativo Día Completo">Permiso Administrativo (P/A)</option>
                            <option value="Descanso Complementario">Tiempo Compensatorio (T/C)</option>
                            <option value="Capacitación">Capacitación (J/C)</option>
                            <option value="Docencia">Horas de Docencia (H/D)</option>
                            <option value="Completa">Licencia Médica Completa (L/M)</option>
                          </select>
                        </div>
                      </div>
                      <div className="flex justify-end pt-2">
                        <button type="submit" className="bg-blue-600 text-white px-8 py-3.5 rounded-2xl font-black text-xs hover:bg-blue-700 shadow-xl shadow-blue-600/20 transition">Aplicar Rango Masivo a Seleccionadas</button>
                      </div>
                    </form>
                  </div>
                )}

                {isAdmin && !modoMasivo && (
                  <div className="border border-slate-200 p-6 rounded-3xl mb-8 bg-slate-50/50">
                    <h3 className="font-extrabold text-base text-slate-900 mb-5">Agregar o Modificar Registro Individual</h3>
                    <div className="mb-5">
                      <label className="block text-xs font-extrabold text-slate-700 uppercase mb-2">Fecha</label>
                      <input type="date" value={fechaPermiso} onChange={e => setFechaPermiso(e.target.value)} className="p-3 border border-slate-200 rounded-2xl bg-white font-bold outline-none shadow-sm" />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                      <form onSubmit={handleAgregarPermiso} className="border border-blue-100 p-5 rounded-3xl bg-white space-y-4 shadow-sm">
                        <h4 className="font-black text-blue-950 text-xs uppercase tracking-widest">Permiso</h4>
                        <select value={tipoPermiso} onChange={e => setTipoPermiso(e.target.value)} className="w-full p-3 border border-slate-200 rounded-2xl text-xs font-semibold bg-slate-50 outline-none">
                          <option value="Feriado Legal">Feriado Legal (F/L)</option>
                          <option value="Administrativo Día Completo">Permiso Admin (P/A)</option>
                          <option value="Administrativo Medio Día">Media Permiso Admin (1/2 P/A)</option>
                          <option value="Descanso Complementario">Tiempo Comp. (T/C)</option>
                          <option value="Capacitación">Capacitación (J/C)</option>
                          <option value="Docencia">Docencia (H/D)</option>
                          <option value="Receso Invernal">Receso Invernal (R/I)</option>
                        </select>
                        {tipoPermiso === 'Administrativo Medio Día' && (
                          <select value={jornadaMedio} onChange={e => setJornadaMedio(e.target.value)} className="w-full p-2.5 border rounded-2xl text-xs font-semibold outline-none">
                            <option value="AM">AM</option><option value="PM">PM</option>
                          </select>
                        )}
                        <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-2xl font-black text-xs hover:bg-blue-700 shadow-lg shadow-blue-200 transition">Agregar Permiso</button>
                      </form>

                      <form onSubmit={handleAgregarLicencia} className="border border-rose-100 p-5 rounded-3xl bg-white space-y-4 shadow-sm">
                        <h4 className="font-black text-rose-950 text-xs uppercase tracking-widest">Licencia Médica</h4>
                        <select value={tipoLicencia} onChange={e => setTipoLicencia(e.target.value)} className="w-full p-3 border border-slate-200 rounded-2xl text-xs font-semibold bg-slate-50 outline-none">
                          <option value="Completa">Completa (L/M)</option>
                          <option value="Media">Media Jornada (1/2 L/M)</option>
                        </select>
                        {tipoLicencia === 'Media' && (
                          <select value={jornadaMedio} onChange={e => setJornadaMedio(e.target.value)} className="w-full p-2.5 border rounded-2xl text-xs font-semibold outline-none">
                            <option value="AM">AM</option><option value="PM">PM</option>
                          </select>
                        )}
                        <button type="submit" className="w-full bg-rose-600 text-white py-3 rounded-2xl font-black text-xs hover:bg-rose-700 shadow-lg shadow-rose-200 transition">Agregar Licencia</button>
                      </form>

                      <form onSubmit={handleRegistrarAtraso} className="border border-amber-100 p-5 rounded-3xl bg-white space-y-4 shadow-sm">
                        <h4 className="font-black text-amber-950 text-xs uppercase tracking-widest">Atraso</h4>
                        <div>
                          <label className="text-xs font-bold text-slate-700 block mb-1.5">Minutos de atraso:</label>
                          <input type="number" min="1" value={minutosAtrasoExtra} onChange={e => setMinutosAtrasoExtra(e.target.value)} className="w-full p-3 border border-slate-200 rounded-2xl text-xs font-bold outline-none" />
                        </div>
                        <button type="submit" className="w-full bg-amber-500 text-white py-3 rounded-2xl font-black text-xs hover:bg-amber-600 shadow-lg shadow-amber-200 transition mt-2">Registrar Atraso</button>
                      </form>
                    </div>
                  </div>
                )}

                {!modoMasivo && (
                  <div className="border-t border-slate-200 pt-6">
                    <h3 className="font-black text-slate-900 text-lg mb-5">
                      Histórico Completo de: <span className="text-blue-600">{funcionariaActualObj?.nombre}</span>
                    </h3>

                    <div className="space-y-3.5">
                      {historicoFunc.map((h, i) => (
                        <div key={i} className="flex flex-col md:flex-row justify-between items-start md:items-center p-5 bg-slate-50 border border-slate-200 rounded-3xl gap-3">
                          <div className="space-y-1.5">
                            <span className="font-mono text-xs font-black bg-slate-200 px-3 py-1 rounded-xl text-slate-700">📅 {h.fecha}</span>
                            <div className="flex flex-wrap gap-2 mt-2">
                              {h.licencia && (
                                <span className="px-3.5 py-1.5 bg-rose-50 text-rose-700 font-black rounded-2xl text-xs border border-rose-200">
                                  L/M: {h.licencia.tipo} {h.licencia.jornada ? `(${h.licencia.jornada})` : ''}
                                </span>
                              )}
                              {h.permisos?.map((p, pIdx) => (
                                <span key={pIdx} className="px-3.5 py-1.5 bg-blue-50 text-blue-700 font-black rounded-2xl text-xs border border-blue-200">
                                  Permiso: {p.tipo} {p.jornada ? `(${p.jornada})` : ''}
                                </span>
                              ))}
                              {h.estado === 'Atraso' && (
                                <span className="px-3.5 py-1.5 bg-amber-50 text-amber-700 font-black rounded-2xl text-xs border border-amber-200">
                                  Atraso: {h.atrasoMinutos} minutos
                                </span>
                              )}
                            </div>
                          </div>

                          {isAdmin && (
                            <div className="flex space-x-2">
                              {h.licencia && (
                                <button onClick={async () => {
                                  const rId = `${h.fecha}_${selectedFuncId}`;
                                  await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registros', rId), { ...registros[rId], licencia: null }, { merge: true });
                                }} className="text-xs text-rose-600 bg-white border border-rose-300 px-4 py-2 rounded-2xl font-bold hover:bg-rose-50 shadow-sm transition">Eliminar L/M</button>
                              )}
                              {h.estado === 'Atraso' && (
                                <button onClick={async () => {
                                  const rId = `${h.fecha}_${selectedFuncId}`;
                                  await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registros', rId), { ...registros[rId], estado: null, atrasoMinutos: 0 }, { merge: true });
                                }} className="text-xs text-amber-600 bg-white border border-amber-300 px-4 py-2 rounded-2xl font-bold hover:bg-amber-50 shadow-sm transition">Eliminar Atraso</button>
                              )}
                            </div>
                          )}
                        </div>
                      ))}
                      {historicoFunc.length === 0 && (
                        <p className="text-sm text-slate-400 text-center py-12 font-medium">No hay registros históricos de permisos, licencias o atrasos para esta funcionaria.</p>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        function VistaResumen({ funcionarias, registros, db, appId, isAdmin }) {
          const [mes, setMes] = useState('2026-07'); 
          const year = parseInt(mes.split('-')[0]);
          const month = parseInt(mes.split('-')[1]);
          const daysOfMonth = getDaysOfMonth(year, month);
          const nombreMesAnio = new Date(year, month - 1, 1).toLocaleString('es-ES', { month: 'long', year: 'numeric' }).toUpperCase();

          const [editandoMasivo, setEditandoMasivo] = useState(false);
          const [formDataMasivo, setFormDataMasivo] = useState({});

          const abrirCargaDirecta = () => {
            if (!isAdmin) return alert("Acción denegada para cuentas con perfil lector.");
            const initialData = {};
            funcionarias.forEach(f => {
              daysOfMonth.forEach(d => {
                const recKey = `${d}_${f.id}`;
                const rec = registros[recKey];
                let val = '.';
                if (rec) {
                  if (rec.licencia?.tipo === 'Completa') val = 'L/M';
                  else if (rec.licencia?.tipo === 'Media') val = '1/2 L/M';
                  else if (rec.permisos?.some(p => p.tipo === 'Feriado Legal')) val = 'F/L';
                  else if (rec.permisos?.some(p => p.tipo === 'Administrativo Día Completo')) val = 'P/A';
                  else if (rec.permisos?.some(p => p.tipo === 'Receso Invernal')) val = 'R/I';
                  else if (rec.permisos?.some(p => p.tipo === 'Descanso Complementario')) val = 'T/C';
                  else if (rec.permisos?.some(p => p.tipo === 'Docencia')) val = 'H/D';
                  else if (rec.permisos?.some(p => p.tipo === 'Capacitación')) val = 'J/C';
                  else if (rec.estado === 'Ausente') val = '/';
                  else if (rec.estado === 'Atraso') val = "'";
                }
                initialData[recKey] = val;
              });
            });
            setFormDataMasivo(initialData);
            setEditandoMasivo(true);
          };

          const handleCellChange = (recKey, val) => {
            setFormDataMasivo(prev => ({ ...prev, [recKey]: val }));
          };

          const guardarCargaDirecta = async () => {
            if (!window.confirm("¿Estás seguro de guardar esta carga masiva directa en el reporte mensual?")) return;
            
            try {
              for (const [recKey, val] of Object.entries(formDataMasivo)) {
                const firstUnderscore = recKey.indexOf('_');
                if (firstUnderscore !== -1) {
                  const d = recKey.substring(0, firstUnderscore);
                  const funcId = recKey.substring(firstUnderscore + 1);
                  let estado = null;
                  let licencia = null;
                  let permisos = [];
                  let atrasoMins = 0;

                  if (val === '.') estado = 'Presente';
                  else if (val === '/') estado = 'Ausente';
                  else if (val === "'") { estado = 'Atraso'; atrasoMins = 30; }
                  else if (val === 'L/M') licencia = { tipo: 'Completa' };
                  else if (val === '1/2 L/M') licencia = { tipo: 'Media', jornada: 'AM' };
                  else if (val === 'F/L') permisos.push({ tipo: 'Feriado Legal' });
                  else if (val === 'P/A') permisos.push({ tipo: 'Administrativo Día Completo' });
                  else if (val === 'R/I') permisos.push({ tipo: 'Receso Invernal' });
                  else if (val === 'T/C') permisos.push({ tipo: 'Descanso Complementario' });
                  else if (val === 'H/D') permisos.push({ tipo: 'Docencia' });
                  else if (val === 'J/C') permisos.push({ tipo: 'Capacitación' });

                  const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'registros', recKey);
                  await setDoc(docRef, { fecha: d, funcId, estado, licencia, permisos, atrasoMinutos: atrasoMins }, { merge: true });
                }
              }

              setEditandoMasivo(false);
              alert("¡Carga masiva directa guardada con éxito!");
            } catch (err) {
              console.error(err);
              alert("Ocurrió un error al guardar los cambios.");
            }
          };

          const handlePrint = () => window.print();

          const exportToWord = () => {
            const content = document.getElementById("report-document").outerHTML;
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Reporte Asistencia</title><style>table { border-collapse: collapse; width: 100%; font-size: 7.5pt; font-family: Arial;} th, td { border: 1px solid black; padding: 1px; text-align: center; } .name { text-align: left; padding-left: 5px; }</style></head><body>";
            const blob = new Blob(['\ufeff', header + content + "</body></html>"], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `Asistencia_${mes}.doc`;
            link.click();
            URL.revokeObjectURL(url);
          };

          const handleImportWord = async (e) => {
            if (!isAdmin) return alert("Acción denegada para cuentas con perfil lector.");
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(event) {
              const arrayBuffer = event.target.result;
              try {
                mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
                  .then(async function(result) {
                    const parser = new DOMParser();
                    const docHtml = parser.parseFromString(result.value, 'text/html');
                    const tables = docHtml.querySelectorAll('table');
                    
                    if (tables.length === 0) {
                      return alert("No se encontró ninguna tabla en el archivo Word seleccionado.");
                    }

                    for (let t = 0; t < tables.length; t++) {
                      const rows = tables[t].querySelectorAll('tr');
                      for (let r = 1; r < rows.length; r++) {
                        const cols = rows[r].querySelectorAll('td, th');
                        if (cols.length >= 2) {
                          const nombreFunc = cols[1].textContent.trim().toUpperCase();
                          const funcObj = funcionarias.find(f => f.nombre.trim().toUpperCase() === nombreFunc);
                          
                          if (funcObj) {
                            for (let c = 2; c < cols.length - 1 && (c - 2) < daysOfMonth.length; c++) {
                              const diaStr = daysOfMonth[c - 2];
                              const cellText = cols[c].textContent.trim();
                              let estado = null;
                              let licencia = null;
                              let permisos = [];

                              if (cellText.includes('L/M')) licencia = { tipo: 'Completa' };
                              else if (cellText.includes('1/2 L/M')) licencia = { tipo: 'Media', jornada: 'AM' };
                              else if (cellText.includes('F/L')) permisos.push({ tipo: 'Feriado Legal' });
                              else if (cellText.includes('P/A')) permisos.push({ tipo: 'Administrativo Día Completo' });
                              else if (cellText.includes('R/I')) permisos.push({ tipo: 'Receso Invernal' });
                              else if (cellText.includes('T/C')) permisos.push({ tipo: 'Descanso Complementario' });
                              else if (cellText.includes('H/D')) permisos.push({ tipo: 'Docencia' });
                              else if (cellText.includes('J/C')) permisos.push({ tipo: 'Capacitación' });
                              else if (cellText.includes('.')) estado = 'Presente';
                              else if (cellText.includes('/')) estado = 'Ausente';
                              else if (cellText.includes("'")) estado = 'Atraso';

                              if (estado || licencia || permisos.length > 0) {
                                const recordId = `${diaStr}_${funcObj.id}`;
                                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'registros', recordId);
                                await setDoc(docRef, { fecha: diaStr, funcId: funcObj.id, estado, licencia, permisos, atrasoMinutos: estado === 'Atraso' ? 30 : 0 }, { merge: true });
                              }
                            }
                          }
                        }
                      }
                    }
                    alert(`¡Importación de Word completada con éxito!`);
                  })
                  .catch(function(err) {
                    console.error(err);
                    alert("Error al parsear el archivo Word.");
                  });
              } catch (err) {
                console.error(err);
                alert("Error al leer el archivo.");
              }
            };
            reader.readAsArrayBuffer(file);
          };

          const grupo1 = funcionarias.slice(0, 16);
          const grupo2 = funcionarias.slice(16, 32);

          const renderTabla = (lista, inicioNum) => {
            if (lista.length === 0) return null;
            return (
              <div className="mb-6 overflow-x-auto">
                <div className="text-center font-black text-xs sm:text-sm mb-3 uppercase tracking-wide text-slate-800">
                  REGISTRO DE ASISTENCIA Y CONTROL - {nombreMesAnio}
                </div>
                <table className="w-full border-collapse text-[9px] sm:text-[10px] print:text-[7pt] bg-white font-mono shadow-sm table-fixed">
                  <thead>
                    <tr className="bg-slate-100 print:bg-white font-black text-slate-800">
                      <th className="border border-black p-0.5 w-[30px] sm:w-8 text-center">Nº</th>
                      <th className="border border-black p-0.5 text-left w-[140px] sm:w-56 font-sans">NOMBRE FUNCIONARIO</th>
                      {daysOfMonth.map(d => (
                        <th key={d} className="border border-black p-0.5 w-[22px] sm:w-7 text-center">{d.slice(8, 10)}</th>
                      ))}
                      <th className="border border-black p-0.5 text-center w-[70px] sm:w-24 font-sans">TOTAL</th>
                    </tr>
                  </thead>
                  <tbody>
                    {lista.map((f, idx) => {
                      let totalAtrasosMins = 0;
                      let totalLicenciaMedicaDias = 0;
                      let contadoresPermisos = { FL: 0, PA: 0, MedioPA: 0, TC: 0, JC: 0, HD: 0, RI: 0 };
                      const numeroReal = inicioNum + idx;

                      daysOfMonth.forEach(d => {
                        const recKey = `${d}_${f.id}`;
                        const rec = editandoMasivo ? null : registros[recKey];
                        
                        if (editandoMasivo) {
                          const val = formDataMasivo[recKey];
                          if (val === 'L/M') totalLicenciaMedicaDias += 1;
                          else if (val === '1/2 L/M') totalLicenciaMedicaDias += 0.5;
                          else if (val === 'F/L') contadoresPermisos.FL++;
                          else if (val === 'P/A') contadoresPermisos.PA++;
                          else if (val === 'R/I') contadoresPermisos.RI++;
                          else if (val === 'T/C') contadoresPermisos.TC++;
                          else if (val === 'H/D') contadoresPermisos.HD++;
                          else if (val === 'J/C') contadoresPermisos.JC++;
                          else if (val === "'") totalAtrasosMins += 30;
                        } else if (rec) {
                          if (rec.licencia?.tipo === 'Completa') totalLicenciaMedicaDias += 1;
                          else if (rec.licencia?.tipo === 'Media') totalLicenciaMedicaDias += 0.5;

                          rec.permisos.forEach(p => {
                            if (p.tipo === 'Feriado Legal') contadoresPermisos.FL++;
                            if (p.tipo === 'Administrativo Día Completo') contadoresPermisos.PA++;
                            if (p.tipo === 'Administrativo Medio Día') contadoresPermisos.MedioPA++;
                            if (p.tipo === 'Descanso Complementario') contadoresPermisos.TC++;
                            if (p.tipo === 'Capacitación') contadoresPermisos.JC++;
                            if (p.tipo === 'Docencia') contadoresPermisos.HD++;
                            if (p.tipo === 'Receso Invernal') contadoresPermisos.RI++;
                          });

                          if (rec.estado === 'Atraso') totalAtrasosMins += rec.atrasoMinutos;
                          if (rec.estado === 'Ausente' && rec.licencia?.tipo === 'Media') totalAtrasosMins += 264;
                        }
                      });

                      return (
                        <tr key={f.id} className="hover:bg-slate-50">
                          <td className="border border-black p-0.5 text-center font-bold">{numeroReal}</td>
                          <td className="border border-black p-0.5 font-bold name pl-1 uppercase font-sans truncate text-[10px] sm:text-xs">{f.nombre}</td>
                          {daysOfMonth.map(d => {
                            const recKey = `${d}_${f.id}`;
                            const rec = registros[recKey];
                            let celdaStr = "";

                            if (editandoMasivo) {
                              celdaStr = formDataMasivo[recKey] || '.';
                            } else if (rec) {
                              if (rec.licencia?.tipo === 'Completa') celdaStr = "L/M";
                              else if (rec.licencia?.tipo === 'Media') celdaStr = "1/2 L/M";

                              if (!celdaStr || celdaStr.includes("1/2")) {
                                rec.permisos.forEach(p => {
                                  if (p.tipo === 'Feriado Legal') celdaStr = "F/L";
                                  if (p.tipo === 'Administrativo Día Completo') celdaStr = "P/A";
                                  if (p.tipo === 'Administrativo Medio Día') celdaStr = "1/2 P/A";
                                  if (p.tipo === 'Descanso Complementario') celdaStr = "T/C";
                                  if (p.tipo === 'Capacitación') celdaStr = "J/C";
                                  if (p.tipo === 'Docencia') celdaStr = "H/D";
                                  if (p.tipo === 'Receso Invernal') celdaStr = "R/I";
                                });
                              }

                              if (!celdaStr || celdaStr.includes("1/2")) {
                                if (rec.estado === 'Presente') celdaStr = celdaStr ? `${celdaStr} .` : ".";
                                else if (rec.estado === 'Ausente') celdaStr = celdaStr ? `${celdaStr} /` : "/";
                                else if (rec.estado === 'Atraso') celdaStr = celdaStr ? `${celdaStr} '` : "'";
                              }
                            }

                            return (
                              <td key={d} className="border border-black p-0 text-center font-bold text-[8.55px] sm:text-[9.5px]">
                                {editandoMasivo ? (
                                  <select value={formDataMasivo[recKey] || '.'} onChange={(e) => handleCellChange(recKey, e.target.value)} className="w-full text-center bg-blue-50 border-0 text-[8.55px] sm:text-[9.5px] font-bold outline-none">
                                    <option value=".">.</option>
                                    <option value="/">/</option>
                                    <option value="'">'</option>
                                    <option value="L/M">L/M</option>
                                    <option value="1/2 L/M">1/2</option>
                                    <option value="F/L">F/L</option>
                                    <option value="P/A">P/A</option>
                                    <option value="R/I">R/I</option>
                                    <option value="T/C">T/C</option>
                                    <option value="H/D">H/D</option>
                                    <option value="J/C">J/C</option>
                                  </select>
                                ) : (
                                  <span className="truncate block" title={celdaStr}>{celdaStr}</span>
                                )}
                              </td>
                            );
                          })}
                          <td className="border border-black p-0.5 text-center font-bold text-[7.5px] sm:text-[8px] font-sans leading-tight">
                            {totalLicenciaMedicaDias > 0 && <span className="text-red-700 block">L/M: {totalLicenciaMedicaDias}d</span>}
                            {totalAtrasosMins > 0 && <span className="text-orange-700 block">Atr: {minsToTime(totalAtrasosMins)}</span>}
                            {contadoresPermisos.FL > 0 && <span className="block">F/L: {contadoresPermisos.FL}</span>}
                            {contadoresPermisos.PA > 0 && <span className="block">P/A: {contadoresPermisos.PA}</span>}
                            {contadoresPermisos.RI > 0 && <span className="block">R/I: {contadoresPermisos.RI}</span>}
                            {contadoresPermisos.TC > 0 && <span className="block">T/C: {contadoresPermisos.TC}</span>}
                            {contadoresPermisos.JC > 0 && <span className="block">J/C: {contadoresPermisos.JC}</span>}
                            {contadoresPermisos.HD > 0 && <span className="block">H/D: {contadoresPermisos.HD}</span>}
                            {contadoresPermisos.MedioPA > 0 && <span className="block">1/2 P/A: {contadoresPermisos.MedioPA}</span>}
                            {totalLicenciaMedicaDias === 0 && totalAtrasosMins === 0 && Object.values(contadoresPermisos).every(v => v === 0) && <span className="text-slate-400">-</span>}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            );
          };

          return (
            <div className="space-y-6 max-w-full overflow-x-auto mx-auto">
              <div className="print:hidden flex flex-col md:flex-row justify-between items-center bg-white p-8 rounded-3xl shadow-sm border border-slate-200/80 gap-4">
                <div>
                  <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900">Reporte Mensual Oficial (Oficio Horizontal)</h2>
                  <p className="text-sm text-slate-500 mt-1 font-medium">Gestión, exportación y celdas adaptadas para visualizar todos los días del mes y nomenclaturas.</p>
                </div>
                <div className="flex flex-wrap items-center gap-3">
                  <input type="month" value={mes} onChange={(e) => setMes(e.target.value)} className="border border-slate-200 p-3 rounded-2xl text-slate-800 outline-none font-bold bg-slate-50 shadow-inner" />
                  
                  {!editandoMasivo ? (
                    <>
                      {isAdmin && (
                        <button onClick={abrirCargaDirecta} className="bg-emerald-600 text-white p-3.5 rounded-2xl hover:bg-emerald-700 flex items-center shadow-lg shadow-emerald-600/20 transition font-bold text-xs">
                          <Icon name="edit-3" size={18} className="mr-2" /> Carga Directa en Tabla
                        </button>
                      )}
                      <button onClick={handlePrint} className="bg-slate-900 text-white p-3.5 rounded-2xl hover:bg-slate-800 flex items-center shadow-md transition" title="Imprimir / PDF (Oficio Horizontal)"><Icon name="printer" size={20} /></button>
                      <button onClick={exportToWord} className="bg-blue-600 text-white p-3.5 rounded-2xl hover:bg-blue-700 flex items-center shadow-lg shadow-blue-600/20 transition" title="Exportar Word"><Icon name="download" size={20} /><span className="ml-2 text-xs font-bold">Exportar Word</span></button>
                      {isAdmin && (
                        <label className="bg-violet-600 text-white p-3.5 rounded-2xl hover:bg-violet-700 flex items-center shadow-lg shadow-violet-600/20 transition cursor-pointer" title="Cargar archivo Word">
                          <Icon name="upload" size={20} />
                          <span className="ml-2 text-xs font-bold">Importar Word</span>
                          <input type="file" accept=".docx" onChange={handleImportWord} className="hidden" />
                        </label>
                      )}
                    </>
                  ) : (
                    <>
                      <button onClick={guardarCargaDirecta} className="bg-emerald-600 text-white px-6 py-3.5 rounded-2xl hover:bg-emerald-700 font-bold text-xs shadow-lg transition">Guardar Cambios Directos</button>
                      <button onClick={() => setEditandoMasivo(false)} className="bg-rose-50 text-rose-600 px-6 py-3.5 rounded-2xl hover:bg-rose-100 font-bold text-xs border border-rose-200 transition">Cancelar</button>
                    </>
                  )}
                </div>
              </div>

              <div id="report-document" className="bg-white p-4 sm:p-8 rounded-3xl shadow-sm border border-slate-200/80 print:shadow-none print:border-none print:p-0 overflow-x-auto">
                {editandoMasivo && (
                  <div className="bg-blue-50 border border-blue-200 p-4 rounded-2xl mb-6 text-blue-900 text-xs font-bold flex items-center justify-between">
                    <span>✏️ Modo de Carga Directa Activado: Edita directamente las celdas de asistencia del mes y haz clic en "Guardar Cambios Directos".</span>
                  </div>
                )}
                {renderTabla(grupo1, 1)}
                {grupo2.length > 0 && renderTabla(grupo2, 17)}
                {funcionarias.length === 0 && (
                  <p className="text-center text-slate-500 py-12">No hay registros disponibles para mostrar en el reporte.</p>
                )}

                <div className="mt-8 text-[10px] print:text-[7pt] border-t border-black pt-4">
                  <table className="w-full border-none font-sans text-slate-900">
                    <tbody>
                      <tr>
                        <td className="border-none p-1"><b>Asistencia:</b> .</td>
                        <td className="border-none p-1"><b>Paro:</b> P</td>
                        <td className="border-none p-1"><b>Suspensión:</b> S</td>
                        <td className="border-none p-1"><b>Comisión de servicio:</b> C/S</td>
                      </tr>
                      <tr>
                        <td className="border-none p-1"><b>Inasistencia:</b> /</td>
                        <td className="border-none p-1"><b>Tiempo compensatorio:</b> T/C</td>
                        <td className="border-none p-1"><b>Traslado:</b> T</td>
                        <td className="border-none p-1"><b>Feriado Legal:</b> F/L</td>
                      </tr>
                      <tr>
                        <td className="border-none p-1"><b>Permiso Administrativo:</b> P/A</td>
                        <td className="border-none p-1"><b>Atrasos min.:</b> ‘</td>
                        <td className="border-none p-1"><b>Jornada Capacitación:</b> J/C</td>
                        <td className="border-none p-1"><b>Receso invernal:</b> R/I</td>
                      </tr>
                      <tr>
                        <td className="border-none p-1"><b>Licencia Médica:</b> L/M</td>
                        <td className="border-none p-1"><b>Fuero Gremial:</b> F/G</td>
                        <td className="border-none p-1"><b>Permiso sin goce Remuneración:</b> P.S.G.</td>
                        <td className="border-none p-1"><b>Horas de Docencia:</b> H/D</td>
                      </tr>
                    </tbody>
                  </table>

                  <div className="mt-12 text-center font-black font-sans text-slate-900">
                    <p>PAULA BORQUEZ BENITT</p>
                    <p className="font-bold text-slate-600">ENCARGADA DE JARDIN</p>
                    <p className="font-bold text-slate-600">JARDIN INFANTIL Y SALA CUNA LAS TERRAZAS</p>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        function VistaFuncionarias({ funcionarias, db, appId, isAdmin }) {
          const [nombre, setNombre] = useState('');
          const [editId, setEditId] = useState(null);
          const save = async (e) => {
            e.preventDefault();
            if (!isAdmin) return alert("Acción denegada para cuentas con perfil lector.");
            if (!nombre.trim()) return;
            if (editId) {
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'funcionarias', editId), { nombre }, { merge: true });
              setEditId(null);
            } else {
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'funcionarias', Date.now().toString()), { nombre, orden: funcionarias.length + 1 });
            }
            setNombre('');
          };
          const remove = async (id) => {
            if (!isAdmin) return alert("Acción denegada para cuentas con perfil lector.");
            if(window.confirm("¿Eliminar?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'funcionarias', id));
          };

          return (
            <div className="max-w-3xl mx-auto bg-white rounded-3xl shadow-sm p-8 border border-slate-200/80">
              <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-1">Gestión de Personal</h2>
              <p className="text-sm text-slate-500 mb-8 font-medium">Personal asignado y visible en tu cuenta.</p>
              {isAdmin && (
                <form onSubmit={save} className="flex space-x-3 mb-8 bg-slate-50 p-5 rounded-3xl border border-slate-200">
                  <input type="text" value={nombre} onChange={e => setNombre(e.target.value)} placeholder="Nombre completo..." className="flex-1 border border-slate-200 p-3.5 rounded-2xl outline-none font-bold bg-white shadow-sm" />
                  <button type="submit" className="bg-slate-900 text-white px-7 py-3.5 rounded-2xl font-black flex items-center hover:bg-slate-800 transition shadow-md"><Icon name="user-plus" size={18} className="mr-2"/> {editId ? 'Guardar' : 'Agregar'}</button>
                </form>
              )}
              <ul className="divide-y divide-slate-100 border border-slate-200/80 rounded-3xl overflow-hidden bg-white shadow-sm">
                {funcionarias.map(f => (
                  <li key={f.id} className="p-4.5 flex justify-between items-center hover:bg-slate-50 transition-colors">
                    <span className="font-extrabold text-slate-800 text-sm">{f.nombre}</span>
                    {isAdmin && (
                      <div className="flex space-x-2">
                        <button onClick={() => { setEditId(f.id); setNombre(f.nombre); }} className="p-2.5 bg-blue-50 text-blue-600 rounded-2xl hover:bg-blue-100 transition"><Icon name="edit-3" size={16}/></button>
                        <button onClick={() => remove(f.id)} className="p-2.5 bg-rose-50 text-rose-600 rounded-2xl hover:bg-rose-100 transition"><Icon name="trash-2" size={16}/></button>
                      </div>
                    )}
                  </li>
                ))}
              </ul>
            </div>
          );
        }

        function VistaUsuarios({ users, db, appId, currentUser, funcionariasDisponibles }) {
          const [nombre, setNombre] = useState('');
          const [apellido, setApellido] = useState('');
          const [username, setUsername] = useState('');
          const [password, setPassword] = useState('');
          const [privilegio, setPrivilegio] = useState('completo');
          const [asignadoA, setAsignadoA] = useState('');
          const [editId, setEditId] = useState(null);

          const saveUser = async (e) => {
            e.preventDefault();
            if (!username.trim() || !nombre.trim() || !apellido.trim()) return;
            
            let userData = { nombre, apellido, username, privilegio, asignadoA: privilegio === 'lector_uno' ? asignadoA : '' };
            if (password.trim()) {
              userData.password = password;
            }

            if (editId) {
              const existingUser = users.find(u => u.id === editId);
              if (!password.trim() && existingUser) {
                userData.password = existingUser.password;
              }
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'app_users', editId), userData, { merge: true });
              setEditId(null);
            } else {
              if (!password.trim()) {
                return alert("Debe ingresar una contraseña para el nuevo usuario.");
              }
              userData.password = password;
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'app_users', Date.now().toString()), userData);
            }
            setNombre(''); setApellido(''); setUsername(''); setPassword(''); setPrivilegio('completo'); setAsignadoA('');
          };

          const removeUser = async (id) => { if(window.confirm("¿Eliminar usuario?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'app_users', id)); };

          return (
            <div className="max-w-4xl mx-auto bg-white rounded-3xl shadow-sm p-8 border border-slate-200/80">
              <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-1">Gestión de Perfiles y Accesos (Administrador)</h2>
              <p className="text-sm text-slate-500 mb-8 font-medium">Crea cuentas, asigna privilegios y restablece contraseñas por olvido si es necesario.</p>
              <form onSubmit={saveUser} className="bg-slate-50 p-6 rounded-3xl border border-slate-200 mb-8 space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1.5">Nombre</label>
                    <input type="text" value={nombre} onChange={e => setNombre(e.target.value)} placeholder="Ej: María" className="w-full border border-slate-200 p-3.5 rounded-2xl outline-none bg-white font-bold text-sm shadow-sm" required />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1.5">Apellido</label>
                    <input type="text" value={apellido} onChange={e => setApellido(e.target.value)} placeholder="Ej: Pérez" className="w-full border border-slate-200 p-3.5 rounded-2xl outline-none bg-white font-bold text-sm shadow-sm" required />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1.5">Usuario (Login)</label>
                    <input type="text" value={username} onChange={e => setUsername(e.target.value)} placeholder="Ej: mperez" className="w-full border border-slate-200 p-3.5 rounded-2xl outline-none bg-white font-bold text-sm shadow-sm" required />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1.5">Contraseña (Nueva / Restablecer)</label>
                    <input type="text" value={password} onChange={e => setPassword(e.target.value)} placeholder={editId ? "Dejar en blanco para mantener" : "Ingrese contraseña"} className="w-full border border-slate-200 p-3.5 rounded-2xl outline-none bg-white font-bold text-sm shadow-sm" />
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1.5">Nivel de Privilegios</label>
                    <select value={privilegio} onChange={e => setPrivilegio(e.target.value)} className="w-full border border-slate-200 p-3.5 rounded-2xl outline-none font-extrabold bg-white text-slate-800 text-sm shadow-sm">
                      <option value="completo">Acceso Completo (Admin total)</option>
                      <option value="lector_todos">Lector Asignado (Ve a todas)</option>
                      <option value="lector_uno">Lector Asignado (Solo un usuario/a)</option>
                    </select>
                  </div>
                  {privilegio === 'lector_uno' && (
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1.5">Funcionaria Asignada</label>
                      <select value={asignadoA} onChange={e => setAsignadoA(e.target.value)} className="w-full border border-slate-200 p-3.5 rounded-2xl outline-none font-extrabold bg-white text-slate-800 text-sm shadow-sm" required>
                        <option value="">Seleccione funcionaria...</option>
                        {funcionariasDisponibles.map(f => (
                          <option key={f.id} value={f.nombre}>{f.nombre}</option>
                        ))}
                      </select>
                    </div>
                  )}
                </div>

                <div className="flex justify-end pt-2">
                  <button type="submit" className="bg-blue-600 text-white px-7 py-3 rounded-2xl font-black text-sm flex items-center hover:bg-blue-700 transition shadow-xl shadow-blue-600/20"><Icon name="user-plus" size={18} className="mr-2"/> {editId ? 'Guardar Cambios' : 'Crear Perfil'}</button>
                </div>
              </form>
              <div className="border border-slate-200 rounded-3xl overflow-hidden bg-white shadow-sm">
                <ul className="divide-y divide-slate-100">
                  {users.map(u => (
                    <li key={u.id} className="p-4.5 flex justify-between items-center hover:bg-slate-50 transition-colors">
                      <div>
                        <span className="font-extrabold text-slate-900 text-base">{u.nombre} {u.apellido}</span>
                        <span className="text-xs text-slate-400 block font-mono">@{u.username} | Clave: <span className="font-bold text-slate-600">{u.password}</span></span>
                        <span className="text-[10px] uppercase px-3 py-1 rounded-xl font-black mt-1 inline-block bg-blue-50 text-blue-700 border border-blue-200">
                          {u.privilegio === 'completo' ? 'Administrador' : u.privilegio === 'lector_todos' ? 'Lector (Todas)' : `Lector (${u.asignadoA})`}
                        </span>
                      </div>
                      <div className="flex space-x-2">
                        <button onClick={() => { setEditId(u.id); setNombre(u.nombre || ''); setApellido(u.apellido || ''); setUsername(u.username); setPassword(''); setPrivilegio(u.privilegio || 'completo'); setAsignadoA(u.asignadoA || ''); }} className="p-2.5 bg-blue-50 text-blue-600 rounded-2xl hover:bg-blue-100 transition" title="Restablecer contraseña o editar"><Icon name="key" size={16}/></button>
                        {u.username !== 'admin' && <button onClick={() => removeUser(u.id)} className="p-2.5 bg-rose-50 text-rose-600 rounded-2xl hover:bg-rose-100 transition"><Icon name="trash-2" size={16}/></button>}
                      </div>
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          );
        }

        function VistaTareas({ tareas, db, appId }) {
          const [nueva, setNueva] = useState('');
          const add = async (e) => {
            e.preventDefault();
            if (!nueva.trim()) return;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tareas', Date.now().toString()), { txt: nueva, done: false });
            setNueva('');
          };
          const toggle = async (t) => setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tareas', t.id), { done: !t.done }, { merge: true });
          const del = async (id) => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tareas', id));

          return (
            <div className="max-w-3xl mx-auto bg-white rounded-3xl shadow-sm p-8 border border-slate-200/80">
              <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-1">Mis Tareas y Pendientes</h2>
              <p className="text-sm text-slate-500 mb-8 font-medium">Organiza tus trabajos y pendientes diarios.</p>
              <form onSubmit={add} className="flex space-x-3 mb-8">
                <input type="text" value={nueva} onChange={e => setNueva(e.target.value)} placeholder="Nuevo trabajo o pendiente..." className="flex-1 border border-slate-200 p-4 rounded-2xl outline-none font-bold text-sm bg-slate-50 shadow-inner" />
                <button type="submit" className="bg-blue-600 text-white px-7 rounded-2xl font-black text-sm shadow-xl shadow-blue-600/20 hover:bg-blue-700 transition">Agregar</button>
              </form>
              <div className="space-y-3.5">
                {tareas.map(t => (
                  <div key={t.id} className={`flex items-center justify-between p-4.5 border rounded-2xl transition ${t.done ? 'bg-slate-50 border-slate-200/60' : 'bg-white border-slate-200 shadow-sm'}`}>
                    <label className="flex items-center space-x-4 cursor-pointer flex-1">
                      <input type="checkbox" checked={t.done} onChange={() => toggle(t)} className="w-5 h-5 text-blue-600 rounded-xl accent-blue-600" />
                      <span className={`text-base font-bold ${t.done ? 'line-through text-slate-400' : 'text-slate-900'}`}>{t.txt}</span>
                    </label>
                    <button onClick={() => del(t.id)} className="p-2.5 text-rose-400 hover:text-rose-600 hover:bg-rose-50 rounded-2xl transition"><Icon name="trash-2" size={18}/></button>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      });
    </script>
  </body>
</html>
